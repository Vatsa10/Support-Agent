services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: defaultdb
      POSTGRES_USER: avnadmin
      POSTGRES_PASSWORD: dev_pw_change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avnadmin -d defaultdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PG_URI: postgres://avnadmin:dev_pw_change_me@postgres:5432/defaultdb?sslmode=disable
      VALKEY_URI: redis://valkey:6379/0
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENVIRONMENT: development
      LOG_FORMAT: json
      SCHEDULER_ENABLED: "true"

volumes:
  pgdata:
